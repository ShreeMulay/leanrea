name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})${{ matrix.advisory && ' advisory' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Required: ubuntu-24.04 and macos-latest x Node 22/24. Advisory: ubuntu-26.04 (may fail without blocking).
    continue-on-error: ${{ matrix.advisory == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        node: ["22", "24"]
        include:
          - os: ubuntu-26.04
            node: "22"
            advisory: true
    env:
      # A smoke-test skip (no network for the pinned npx one-shot, no Go) is a failure in CI.
      LEANREA_SMOKE_REQUIRE_NETWORK: "1"
      LEANREA_SMOKE_REQUIRE_GO: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: startsWith(matrix.os, 'ubuntu')
        with:
          go-version: stable
          cache: false
      # tsc-rs's postinstall only rewrites its launcher for speed; the JS launcher works without it.
      - run: npm ci --ignore-scripts
      - run: npm run check-tree
      - run: npm run lint:skill
      - run: npm run build
      - run: npm test
      - run: npm run parity
      - run: npm run smoke
      - run: npm run pack-test
