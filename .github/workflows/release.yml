name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Tag must equal v + package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version v$version" >&2
            exit 1
          fi
      # tsc-rs's postinstall only rewrites its launcher for speed; the JS launcher works without it.
      - run: npm ci --ignore-scripts
      - name: SKILL.md hash must be listed for this version (src/known-releases.ts)
        run: npm run check-release -- "$GITHUB_REF_NAME"
      - run: npm run lint:skill
      - run: npm run build
      - run: npm test
      - run: npm run parity
      - run: npm run smoke
      - name: pack-test (keeps the tested tarball)
        run: npm run pack-test
        env:
          LEANREA_PACK_OUT: ${{ runner.temp }}/release
      - name: Collect release assets
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{ runner.temp }}/release
        run: |
          cp "$GITHUB_WORKSPACE/leanrea/SKILL.md" SKILL.md
          # Stable name for .../releases/latest/download/leanrea.tgz (same bytes as the versioned tarball).
          cp "leanrea-${GITHUB_REF_NAME#v}.tgz" leanrea.tgz
          cmp "leanrea-${GITHUB_REF_NAME#v}.tgz" leanrea.tgz
          sha256sum "leanrea-${GITHUB_REF_NAME#v}.tgz" leanrea.tgz SKILL.md > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: release-assets
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - name: Verify assets
        working-directory: release
        run: |
          test -f "leanrea-${GITHUB_REF_NAME#v}.tgz"
          test -f leanrea.tgz
          test -f SKILL.md
          cmp "leanrea-${GITHUB_REF_NAME#v}.tgz" leanrea.tgz
          sha256sum -c SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "leanrea $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Install: npx https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/leanrea-${GITHUB_REF_NAME#v}.tgz install" \
            "release/leanrea-${GITHUB_REF_NAME#v}.tgz" \
            release/leanrea.tgz \
            release/SKILL.md \
            release/SHA256SUMS
